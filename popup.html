<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Ticket Creator</title>
    <style>
        body {
            width: 400px;
            min-height: 500px;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 18px;
            text-align: center;
            font-weight: 600;
        }

        .version-info {
            text-align: center;
            margin: -10px 0 20px 0;
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
        }

        .selected-text {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .selected-text.empty {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn.primary {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .btn.primary:hover {
            background: #45a049;
        }

        .btn.secondary {
            background: #2196F3;
            border-color: #2196F3;
        }

        .btn.secondary:hover {
            background: #1976D2;
        }

        .config-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .config-section h4 {
            margin: 0 0 10px 0;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 12px;
            box-sizing: border-box;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .status.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.3);
        }

        .hidden {
            display: none;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ticket-preview {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.4;
        }

        .ticket-preview h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            font-weight: 600;
        }

        .ticket-preview p {
            margin: 0 0 8px 0;
        }

        .ticket-preview p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 Jira Ticket Creator</h1>
                <div class="version-info">
                    Version 1.0.1 • By Bart van den Berg
                </div>
        
        <div id="status" class="status hidden"></div>
        
        <div class="section">
            <h3>Selected Text</h3>
            <div id="selectedText" class="selected-text empty">
                No text selected. Please select text on the current page and click "Get Selected Text".
            </div>
            <button id="getSelectedText" class="btn">📋 Get Selected Text</button>
        </div>

        <div class="config-section">
            <h4>⚙️ Configuration</h4>
            <div class="input-group">
                <label for="openaiApiKey">OpenAI API Key:</label>
                <input type="password" id="openaiApiKey" placeholder="sk-...">
            </div>
            <div class="input-group">
                <label for="jiraDomain">Jira Domain:</label>
                <input type="text" id="jiraDomain" placeholder="yourcompany.atlassian.net">
            </div>
            <div class="input-group">
                <label for="jiraEmail">Jira Email:</label>
                <input type="email" id="jiraEmail" placeholder="your.email@company.com">
            </div>
            <div class="input-group">
                <label for="jiraApiToken">Jira API Token:</label>
                <input type="password" id="jiraApiToken" placeholder="Your Jira API token">
            </div>
            <div class="input-group">
                <label for="jiraProject">Project Key:</label>
                <input type="text" id="jiraProject" placeholder="PROJ">
            </div>
            <div class="input-group">
                <label for="issueType">Issue Type:</label>
                <select id="issueType">
                    <option value="Task">Task</option>
                    <option value="Bug">Bug</option>
                    <option value="Story">Story</option>
                    <option value="Epic">Epic</option>
                </select>
            </div>
            <button id="saveConfig" class="btn secondary">💾 Save Configuration</button>
            <button id="testJiraConnection" class="btn secondary">🔗 Test Jira Connection</button>
        </div>

        <div class="section">
            <button id="analyzeText" class="btn primary" disabled>🤖 Analyze with ChatGPT</button>
        </div>

        <div id="ticketPreview" class="ticket-preview hidden">
            <h4>📝 Generated Ticket Preview</h4>
            <div id="ticketContent"></div>
        </div>

        <div class="section">
            <button id="createTicket" class="btn primary" disabled>🎫 Create Jira Ticket</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>

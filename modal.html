<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Ticket Creator Modal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .selected-text {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn.secondary {
            background: #6c757d;
        }

        .btn.secondary:hover {
            background: #5a6268;
        }

        .btn.success {
            background: #28a745;
        }

        .btn.success:hover {
            background: #218838;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ticket-preview {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .ticket-preview h4 {
            margin-bottom: 15px;
            color: #333;
        }

        .ticket-preview .field {
            margin-bottom: 12px;
        }

        .ticket-preview .field-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
        }

        .ticket-preview .field-value {
            color: #333;
            line-height: 1.4;
        }

        .hidden {
            display: none;
        }

        .loading-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-title {
            font-size: 24px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .loading-message {
            font-size: 16px;
            color: #666;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: #28a745;
            margin-bottom: 10px;
        }

        .success-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .ticket-link {
            display: inline-block;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .ticket-link:hover {
            background: #5a6fd8;
        }

        .config-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .config-section h4 {
            margin-bottom: 15px;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        @media (max-width: 768px) {
            .modal-container {
                width: 95%;
                margin: 20px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title">🎫 Create Jira Ticket</div>
            <button class="close-btn" id="closeModal">&times;</button>
        </div>
        
        <div class="modal-content">
            <div id="status" class="status hidden"></div>
            
            <!-- Loading Screen -->
            <div id="loadingScreen" class="loading-screen">
                <div class="loading-icon">🤖</div>
                <div class="loading-title">Analyzing Text with ChatGPT</div>
                <div class="loading-message">Please wait while we analyze your selected text...</div>
            </div>
            
            <!-- Main Content -->
            <div id="mainContent" class="hidden">
                <div class="section">
                    <div class="section-title">Selected Text</div>
                    <div id="selectedText" class="selected-text">
                        Loading selected text...
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Jira Ticket Details</div>
                    
                    <div class="form-group">
                        <label for="ticketTitle">Title:</label>
                        <input type="text" id="ticketTitle" placeholder="Enter ticket title">
                    </div>
                    
                    <div class="form-group">
                        <label for="ticketDescription">Description:</label>
                        <textarea id="ticketDescription" placeholder="Enter ticket description"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ticketPriority">Priority:</label>
                            <select id="ticketPriority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ticketLabels">Labels (comma-separated):</label>
                            <input type="text" id="ticketLabels" placeholder="label1, label2, label3">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ticketAcceptanceCriteria">Acceptance Criteria (one per line):</label>
                        <textarea id="ticketAcceptanceCriteria" placeholder="Enter acceptance criteria, one per line"></textarea>
                    </div>
                </div>

                <div class="section">
                    <button id="createTicket" class="btn success">🎫 Create Jira Ticket</button>
                    <button id="reanalyzeText" class="btn secondary">🔄 Re-analyze with ChatGPT</button>
                </div>
            </div>

            <!-- Success Screen -->
            <div id="successScreen" class="success-screen hidden">
                <div class="success-icon">✅</div>
                <div class="success-title">Ticket Created Successfully!</div>
                <div class="success-message">Your Jira ticket has been created and is ready for review.</div>
                <a id="ticketLink" class="ticket-link" target="_blank">View Ticket</a>
                <div>
                    <button id="createAnother" class="btn">Create Another Ticket</button>
                    <button id="closeModalSuccess" class="btn secondary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
